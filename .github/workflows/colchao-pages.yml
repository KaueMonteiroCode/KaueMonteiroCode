# Publica o jogo "Do Colchão ao Império" no GitHub Pages (instalável como app, funciona offline).
# Para ativar: Settings → Pages → Source: "GitHub Actions". Roda a cada push na main que mexa no jogo,
# ou manualmente em Actions → "Publicar jogo no GitHub Pages" → Run workflow.
name: Publicar jogo no GitHub Pages
on:
  push:
    branches: [main]
    paths: ['colchao-ao-imperio/**', '.github/workflows/colchao-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: colchao-ao-imperio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: colchao-ao-imperio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: colchao-ao-imperio/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
